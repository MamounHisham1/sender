name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/sender-server-${{ matrix.target }}.tar.gz" \
            -C server/target/release sender-server

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "Sender $GITHUB_REF_NAME" \
            --notes "Prebuilt sender-server binaries. Install with: curl -fsSL https://web-nine-zeta-12.vercel.app/install.sh | bash"
